name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install pytest ruff aiohttp pyyaml
      - run: npm ci
      - run: ruff check custom_components tests qa scripts
      - run: python -m pytest -q
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify committed panel bundle
        run: git diff --exit-code -- custom_components/haos_ai/frontend
      - name: Verify version and build archive
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/release.py build --version "${RELEASE_VERSION#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_VERSION"
          "release/haos-ai-${RELEASE_VERSION#v}.zip"
          "release/haos-ai-${RELEASE_VERSION#v}.zip.sha256"
          --verify-tag --generate-notes --title "HAOS AI ${RELEASE_VERSION#v}"
