name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed panel bundle
        run: git diff --exit-code -- custom_components/haos_ai/frontend
      - name: Verify version and build archive
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/release.py build --version "${RELEASE_VERSION#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_VERSION"
          "release/haos-ai-${RELEASE_VERSION#v}.zip"
          "release/haos-ai-${RELEASE_VERSION#v}.zip.sha256"
          --verify-tag --generate-notes --title "HAOS AI ${RELEASE_VERSION#v}"
