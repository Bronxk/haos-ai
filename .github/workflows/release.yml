name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed panel bundle
        run: git diff --exit-code -- custom_components/haos_ai/frontend
      - name: Verify version and build archive
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/release.py build --version "${RELEASE_VERSION#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_VERSION"
          "release/haos-ai-${RELEASE_VERSION#v}.zip"
          "release/haos-ai-${RELEASE_VERSION#v}.zip.sha256"
          --verify-tag --generate-notes --title "HAOS AI ${RELEASE_VERSION#v}"
