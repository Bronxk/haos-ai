name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install pytest ruff aiohttp pyyaml
      - run: npm ci
      - run: ruff check custom_components tests qa
      - run: python -m pytest -q
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: python scripts/release.py check
      - name: Verify committed panel bundle
        run: git diff --exit-code -- custom_components/haos_ai/frontend

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  home-assistant-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Home Assistant 2026.7 smoke checks
        run: |
          docker run --rm -v "$PWD:/workspace:ro" homeassistant/home-assistant:2026.7 \
            python /workspace/qa/automation_smoke.py
          docker run --rm -v "$PWD:/workspace:ro" homeassistant/home-assistant:2026.7 \
            python /workspace/qa/context_smoke.py
          docker run --rm -v "$PWD:/workspace:ro" homeassistant/home-assistant:2026.7 \
            python /workspace/qa/websocket_smoke.py
          docker run --rm -v "$PWD:/workspace:ro" homeassistant/home-assistant:2026.7 \
            python /workspace/qa/conversation_smoke.py
