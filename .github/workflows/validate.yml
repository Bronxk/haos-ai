name: Validate

on:
  push:
  pull_request:
  workflow_call:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check GitHub Actions workflows
        run: >-
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo
          rhysd/actionlint:1.7.12 -color
      - name: Scan the workspace for secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.30.1 dir /repo
          --redact --no-banner --max-target-megabytes 5

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-08-02
        with:
          category: integration

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install pytest ruff aiohttp pyyaml
      - run: npm ci
      - run: ruff check custom_components tests qa scripts
      - run: python -m pytest -q
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      # A build failure that only shows up in the raw log is hard to triage
      # from a notification, so mirror the tail into the check annotations.
      - name: Build the panel bundle
        run: |
          log=$(mktemp)
          if npm run build >"$log" 2>&1; then
            cat "$log"
          else
            cat "$log"
            tail -40 "$log" | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
      - run: python scripts/release.py check
      - name: Verify committed panel bundle
        run: git diff --exit-code -- custom_components/haos_ai/frontend

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master 2026-09-10

  panel-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # This loads the committed bundle in a real engine, which is the only
      # place a missing icon glyph or a responsive overflow can be observed.
      - name: Check the committed panel in a real browser
        run: |
          python3 -m http.server 4173 &
          sleep 2
          node qa/visual.mjs

  home-assistant-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        home-assistant: ["2026.7", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Home Assistant runtime smoke checks
        run: |
          python3 scripts/release.py build
          docker run --rm -v "$PWD:/workspace:ro" homeassistant/home-assistant:${{ matrix.home-assistant }} \
            python /workspace/qa/automation_smoke.py
          docker run --rm -v "$PWD:/workspace:ro" homeassistant/home-assistant:${{ matrix.home-assistant }} \
            python /workspace/qa/context_smoke.py
          docker run --rm -v "$PWD:/workspace:ro" homeassistant/home-assistant:${{ matrix.home-assistant }} \
            python /workspace/qa/get_automations_smoke.py
          docker run --rm -v "$PWD:/workspace:ro" homeassistant/home-assistant:${{ matrix.home-assistant }} \
            python /workspace/qa/websocket_smoke.py
          docker run --rm -v "$PWD:/workspace:ro" homeassistant/home-assistant:${{ matrix.home-assistant }} \
            python /workspace/qa/conversation_smoke.py
          docker run --rm -v "$PWD:/workspace:ro" homeassistant/home-assistant:${{ matrix.home-assistant }} \
            python /workspace/qa/change_safety_smoke.py
          docker run --rm -v "$PWD:/workspace:ro" homeassistant/home-assistant:${{ matrix.home-assistant }} \
            python /workspace/qa/automation_apply_smoke.py
          docker run --rm -v "$PWD:/workspace:ro" homeassistant/home-assistant:${{ matrix.home-assistant }} \
            python /workspace/qa/release_archive_smoke.py
          docker run --rm \
            -v "$PWD/custom_components:/config/custom_components:ro" \
            -v "$PWD/qa/install_smoke.py:/install_smoke.py:ro" \
            homeassistant/home-assistant:${{ matrix.home-assistant }} \
            python /install_smoke.py
